<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Strict Popup Blocker</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <main class="shell">
      <header class="brand">
        <div class="brand-mark" aria-hidden="true"></div>
        <div class="brand-text">
          <h1>Strict Popup Blocker</h1>
          <p class="tagline">Popups por ventana · capas opcionales</p>
        </div>
      </header>

      <section class="power" aria-labelledby="power-label">
        <div class="power-copy">
          <span id="power-label" class="power-label">Popups</span>
          <strong id="statusText" class="status-text">Desactivada</strong>
          <span id="scopeHint" class="scope-hint">Apagada en esta ventana</span>
        </div>
        <label class="switch" title="Bloquear popups externos en esta ventana">
          <input
            type="checkbox"
            id="enabledToggle"
            role="switch"
            aria-checked="false"
          />
          <span class="track" aria-hidden="true">
            <span class="thumb"></span>
            <span class="on-label">ON</span>
            <span class="off-label">OFF</span>
          </span>
        </label>
      </section>

      <section class="site" aria-live="polite">
        <div class="site-row">
          <span class="muted">Sitio actual</span>
          <strong id="currentHost">—</strong>
        </div>
        <button type="button" id="whitelistBtn" class="ghost-btn" disabled>
          Permitir excepciones en este sitio
        </button>
      </section>

      <section class="layers" aria-labelledby="layers-title">
        <div class="layers-head">
          <h2 id="layers-title">Capas extras</h2>
          <p class="layers-note">
            Apagadas por defecto. Solo aplican si Popups está ON.
          </p>
        </div>
        <label class="layer-row">
          <span>
            <strong>Cookies JS</strong>
            <small>document.cookie / Cookie Store</small>
          </span>
          <input type="checkbox" id="layerCookiesJs" data-layer="cookiesJs" />
        </label>
        <label class="layer-row warn">
          <span>
            <strong>Cookies HTTP</strong>
            <small>Puede cerrar la sesión del sitio</small>
          </span>
          <input
            type="checkbox"
            id="layerCookiesHttp"
            data-layer="cookiesHttp"
          />
        </label>
        <label class="layer-row">
          <span>
            <strong>Descargas</strong>
            <small>Cancela descargas del sitio</small>
          </span>
          <input type="checkbox" id="layerDownloads" data-layer="downloads" />
        </label>
        <label class="layer-row warn">
          <span>
            <strong>Storage</strong>
            <small>localStorage / sessionStorage</small>
          </span>
          <input type="checkbox" id="layerStorage" data-layer="storage" />
        </label>
        <label class="layer-row">
          <span>
            <strong>Trackers</strong>
            <small>Beacon, SW, notificaciones, clipboard</small>
          </span>
          <input type="checkbox" id="layerTrackers" data-layer="trackers" />
        </label>
      </section>

      <section class="stats">
        <div class="stat">
          <span class="stat-value" id="blockedCount">0</span>
          <span class="stat-label">Bloqueados hoy</span>
        </div>
        <div class="stat">
          <span class="stat-value" id="logCount">0</span>
          <span class="stat-label">En el registro</span>
        </div>
      </section>

      <section class="log-wrap">
        <div class="log-head">
          <h2>Últimos bloqueos</h2>
        </div>
        <ul id="blockLog" class="log"></ul>
        <p id="emptyLog" class="empty">Aún no hay bloqueos registrados.</p>
      </section>
    </main>
    <script type="module" src="popup.js"></script>
  </body>
</html>
